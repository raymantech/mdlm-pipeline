name: MDLM Daily Pipeline (B1)

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 01:30 运行（中国时间 +8 => 09:30）
    - cron: "30 1 * * *"

permissions:
  contents: write

concurrency:
  group: mdlm-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Create venv + install deps
        shell: bash
        run: |
          set -euo pipefail
          python -V
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt

      - name: Run pipeline (daily + export)
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python backend/run_daily.py

      - name: Verify output exists
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/data/merged_events_latest.json
          ls -lh frontend/data/merged_events_latest.json

      - name: Push output to data branch
        shell: bash
        env:
          OUT_FILE: frontend/data/merged_events_latest.json
          DATA_BRANCH: data
          DEST_PATH: merged_events_latest.json
        run: |
          set -euo pipefail

          # 配置 git 身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 确保能拿到 data 分支（不存在就创建）
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$DATA_BRANCH":"refs/remotes/origin/$DATA_BRANCH"
            git switch -C "$DATA_BRANCH" "origin/$DATA_BRANCH"
          else
            git switch --orphan "$DATA_BRANCH"
            rm -rf ./*
            echo "# MDLM data branch" > README.md
            git add README.md
            git commit -m "init: data branch"
            git push -u origin "$DATA_BRANCH"
          fi

          # 把 main 分支产出的文件拷贝过来
          git show "main:$OUT_FILE" > "$DEST_PATH"

          # 如果无变化就不提交
          if git status --porcelain | grep -q .; then
            git add "$DEST_PATH"
            git commit -m "data: update $DEST_PATH ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin "$DATA_BRANCH"
          else
            echo "No changes. Skip commit."
          fi
