name: MDLM Daily Pipeline (A)

on:
  workflow_dispatch: {}
  schedule:
    # GitHub cron 使用 UTC。下面是每天 UTC 00:30（日本时间 JST 09:30）
    - cron: "30 0 * * *"

permissions:
  contents: write

concurrency:
  group: mdlm-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch data branch (history db/json)
        run: |
          git fetch origin data:data || true
          # 如果 data 分支存在，就把 db/json 拉过来作为“历史底座”
          if git show-ref --verify --quiet refs/heads/data; then
            git checkout data -- backend/charts.db frontend/data/merged_events_latest.json || true
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt

      - name: Run pipeline (daily + backfill + export)
        env:
          # 统一让脚本知道自己在哪
          MDLM_ROOT: ${{ github.workspace }}
        run: |
          bash run.sh

      - name: Verify output exists
        run: |
          ls -lh frontend/data/merged_events_latest.json
          ls -lh backend/charts.db

      - name: Push outputs to data branch
        run: |
          git config user.name "mdlm-bot"
          git config user.email "mdlm-bot@users.noreply.github.com"

          # 切到 data 分支（不存在就创建）
          if git show-ref --verify --quiet refs/heads/data; then
            git checkout data
          else
            git checkout -b data
          fi

          # 确保目录存在
          mkdir -p backend frontend/data

          # 把运行产物放到 data 分支
          git add backend/charts.db frontend/data/merged_events_latest.json

          # 如果没变化，不报错
          git commit -m "data: update db+json $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "No changes to commit"

          git push origin data
