name: MDLM Daily Pipeline (Dispatch Only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mdlm-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 关键：尝试从 data 分支恢复历史 charts.db（作为事件对比基线）
      - name: Restore charts.db from data branch (if exists)
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin --prune

          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "[INFO] origin/data exists, try restore charts.db"
            rm -rf ../_data_restore
            git worktree add ../_data_restore data

            if [ -f ../_data_restore/data/charts.db ]; then
              mkdir -p backend
              cp -f ../_data_restore/data/charts.db backend/charts.db
              ls -lh backend/charts.db
              echo "[INFO] Restored backend/charts.db from data branch."
            else
              echo "[INFO] data/charts.db not found on data branch, skip restore."
            fi

            git worktree remove ../_data_restore --force
            rm -rf ../_data_restore
          else
            echo "[INFO] origin/data not found, skip restore."
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Create venv + install deps
        shell: bash
        run: |
          set -euo pipefail
          python -V
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -U pip
          python -m pip install -r backend/requirements.txt

      - name: Run MDLM daily pipeline
        shell: bash
        env:
          EXPORT_DAYS: "7"
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python backend/run_daily.py

      - name: Verify outputs exist
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/data/merged_events_latest.json
          ls -lh frontend/data/merged_events_latest.json

          # charts.db 可能在流程中被创建/更新
          if [ -f backend/charts.db ]; then
            ls -lh backend/charts.db
          else
            echo "[WARN] backend/charts.db not found after run."
          fi

      # 推送 merged_events_latest.json + charts.db 到 data 分支（持久化基线）
      - name: Push outputs to data branch (worktree)
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin --prune

          # 确保 data 分支存在；不存在则创建
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            echo "[INFO] origin/data exists"
          else
            echo "[INFO] origin/data not found, creating empty data branch"
            git checkout --orphan data
            git rm -rf .
            mkdir -p data
            echo "data branch for MDLM outputs" > data/README.txt
            git add data/README.txt
            git commit -m "init data branch"
            git push -u origin data
            git checkout main
            git fetch origin --prune
          fi

          # 创建 worktree
          rm -rf ../_data_branch
          git worktree add ../_data_branch data

          # 复制输出文件
          mkdir -p ../_data_branch/data
          cp -f frontend/data/merged_events_latest.json ../_data_branch/data/merged_events_latest.json

          # 同步 charts.db（如果存在）
          if [ -f backend/charts.db ]; then
            cp -f backend/charts.db ../_data_branch/data/charts.db
          else
            echo "[WARN] backend/charts.db missing, will not update data/charts.db"
          fi

          cd ../_data_branch
          git add data/merged_events_latest.json || true
          if [ -f data/charts.db ]; then
            git add data/charts.db
          fi

          if git diff --cached --quiet; then
            echo "[INFO] No changes to commit on data branch."
          else
            git commit -m "data: update outputs ($(date -u +'%Y-%m-%d %H:%M:%S') UTC)"
            git push origin data
          fi

          cd -
          git worktree remove ../_data_branch --force
          rm -rf ../_data_branch

      - name: Upload artifacts (json + charts.db)
        uses: actions/upload-artifact@v4
        with:
          name: mdlm_outputs
          path: |
            frontend/data/merged_events_latest.json
            backend/charts.db
