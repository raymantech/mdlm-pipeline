name: MDLM Scheduler (TEMP 15:40–15:44 BJ)

on:
  workflow_dispatch:
  schedule:
    # 每 5 分钟跑一次，用于探测时间窗口
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to dispatch MDLM Daily Pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          WORKFLOW_FILE: "mdlm_daily_21_bj.yml"
          REF: "main"
        run: |
          set -euo pipefail

          echo "=== MDLM Scheduler ==="

          # 取北京时间
          BJ_TIME=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          BJ_HOUR=$(TZ=Asia/Shanghai date '+%H')
          BJ_MIN=$(TZ=Asia/Shanghai date '+%M')

          echo "Beijing time now: $BJ_TIME"

          # ===== 临时验证窗口：15:40–15:44 =====
          if [ "$BJ_HOUR" = "15" ] && [ "$BJ_MIN" -ge "40" ] && [ "$BJ_MIN" -lt "45" ]; then
            echo "[HIT] Time window matched. Dispatching workflow..."

            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$OWNER/$REPO/actions/workflows/$WORKFLOW_FILE/dispatches \
              -d "{\"ref\":\"$REF\"}"

            echo "[OK] Dispatch request sent."
          else
            echo "[SKIP] Not in dispatch window (15:40–15:44 BJ)."
          fi
